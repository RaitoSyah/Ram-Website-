    <style>
        .search-row { display:flex; gap:8px; margin-top:4px; }
        .search-row input { flex:1; min-width:0; padding:10px 12px; font-size:16px; border:1px solid var(--border, #ccc); border-radius:8px; background:transparent; color:inherit; font-family:inherit; }

        .search-row input::-webkit-search-decoration { -webkit-appearance:none; appearance:none; display:none; }
        .search-row button { padding:10px 14px; border:1px solid var(--border, #ccc); border-radius:8px; background:transparent; color:inherit; cursor:pointer; font-family:inherit; }
        .tag-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
        .tag-pill { display:inline-block; padding:4px 12px; border:1px solid var(--accent); border-radius:999px; font-size:13px; color:var(--accent); background:transparent; cursor:pointer; text-transform:capitalize; font-family:inherit; text-decoration:none; }

        .result-info { font-size:14px; color:var(--text-light); margin:12px 0; }
        .more-btn { display:block; width:100%; margin-top:16px; padding:12px; border:1px solid var(--border, #ccc); border-radius:8px; background:transparent; color:inherit; cursor:pointer; font-size:15px; font-family:inherit; }

<body>

    <header>

        <h1>Raito Syah</h1>

        <nav>

            <a href="../index.html">Home</a>

            <a href="../index.html#about">About</a>

            <a href="index.html">Writings</a>

        </nav>

    </header>


    <main>

        <section>
            <p class="writing-category">RAMDHAN'S WRITINGS</p>
            <h2>Tersimpan</h2>
            <p class="card-meta">
                Tulisan yang kamu simpan tersimpan di akun Google-mu, jadi bisa dibuka
                dari perangkat mana pun. Daftar ini hanya bisa dilihat olehmu.
            </p>
        </section>


        <section>
            <h2 id="list-title">Memuat...</h2>
            <div id="saved-list"></div>
        </section>


        <p>
            <a class="back-link" href="all.html">← Semua tulisan</a>
        </p>

    </main>


    <footer>

        <p>
            © 2026 Ramdhan
        </p>

    </footer>


    <script type="module">

        import { auth, db } from "../firebase-config.js";

        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        import {
            collection,
            query,
            where,
            getDocs,
            doc,
            getDoc,
            setDoc,
            deleteDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";


        const LOCAL_KEY = "savedArticles"; // simpanan lama yang tersimpan di browser (versi sebelumnya)

        const listEl = document.getElementById("saved-list");
        const titleEl = document.getElementById("list-title");

        let currentUser = null;

        const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));

        function localSaved() {
            try {
                const arr = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
                return Array.isArray(arr) ? arr.filter(x => x && typeof x.id === "string") : [];
            } catch (e) {
                return [];
            }
        }

        function formatDate(ts) {
            return ts && ts.toDate
                ? ts.toDate().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })
                : "";
        }

        function readMinutes(text) {
            const words = String(text || "").trim().split(/\s+/).filter(Boolean).length;
            return Math.max(1, Math.ceil(words / 250));
        }

        function removeBtn(id) {
            return `<button type="button" class="more-btn" style="margin-top:12px;" data-remove="${esc(id)}">Hapus dari simpanan</button>`;
        }

        function cardHtml(id, state, data) {

            if (state === "ok") {
                const dateText = formatDate(data.createdAt);
                const meta = (dateText ? dateText + " · " : "") + readMinutes(data.contentText ?? data.content) + " min read";
                return `
                    <article class="writing-card">
                        <h3>${esc(data.title)}</h3>
                        <p class="card-meta">${esc(meta)}</p>
                        <p>${esc(data.description)}</p>
                        <a href="article.html?id=${encodeURIComponent(id)}">Read this →</a>
                        ${removeBtn(id)}
                    </article>
                `;
            }

            const msg = state === "missing"
                ? "Tulisan ini sudah tidak tersedia."
                : "Gagal memuat tulisan ini. Periksa koneksi lalu muat ulang halaman.";

            return `
                <article class="writing-card">
                    <h3>Tulisan tidak dapat ditampilkan</h3>
                    <p>${esc(msg)}</p>
                    ${removeBtn(id)}
                </article>
            `;
        }

        function showLoginPrompt() {
            titleEl.textContent = "Masuk untuk melihat simpananmu";
            listEl.innerHTML = `
                <article class="writing-card">
                    <p>Simpananmu tersimpan di akun Google, jadi kamu perlu masuk dulu.</p>
                    <button type="button" class="more-btn" data-login>Masuk</button>
                </article>
            `;
        }

        async function load() {

            if (!currentUser) {
                showLoginPrompt();
                return;
            }

            titleEl.textContent = "Memuat...";

            let ids;

            try {
                const snap = await getDocs(query(collection(db, "saves"), where("userId", "==", currentUser.uid)));
                ids = snap.docs
                    .map(d => {
                        const x = d.data();
                        return { id: x.articleId, at: x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : 0 };
                    })
                    .sort((a, b) => b.at - a.at);
            } catch (e) {
                titleEl.textContent = "Gagal memuat";
                listEl.innerHTML = `
                    <article class="writing-card">
                        <p>Daftar simpanan tidak bisa dimuat. Pastikan aturan Firestore untuk koleksi <code>saves</code> sudah dipasang, lalu coba lagi.</p>
                    </article>
                `;
                return;
            }

            // Simpanan lama dari browser ini (sebelum fitur ini per akun) bisa dipindahkan ke akun
            const known = new Set(ids.map(x => x.id));
            const old = localSaved().filter(x => !known.has(x.id));
            const importHtml = old.length ? `
                <article class="writing-card">
                    <p>Ada ${old.length} tulisan yang kamu simpan di browser ini sebelumnya.</p>
                    <button type="button" class="more-btn" data-import>Pindahkan ke akunku</button>
                </article>
            ` : "";

            if (!ids.length) {
                titleEl.textContent = "Belum ada yang disimpan";
                listEl.innerHTML = importHtml + `
                    <article class="writing-card">
                        <p>Ketuk tombol <strong>Simpan</strong> di bawah sebuah tulisan, dan tulisan itu akan muncul di sini.</p>
                        <a href="all.html">Jelajahi tulisan →</a>
                    </article>
                `;
                return;
            }

            titleEl.textContent = `Tersimpan (${ids.length})`;

            const rows = await Promise.all(ids.map(async (s) => {
                try {
                    const snap = await getDoc(doc(db, "writings", s.id));
                    return snap.exists()
                        ? { id: s.id, state: "ok", data: snap.data() }
                        : { id: s.id, state: "missing" };
                } catch (e) {
                    return { id: s.id, state: "error" };
                }
            }));

            listEl.innerHTML = importHtml + rows.map(r => cardHtml(r.id, r.state, r.data)).join("");
        }

        document.addEventListener("click", async (e) => {

            if (e.target.closest("[data-login]")) {
                const trigger = document.querySelector(".auth-widget-trigger");
                if (trigger) trigger.click();
                return;
            }

            const rm = e.target.closest("[data-remove]");
            if (rm && currentUser) {
                try {
                    await deleteDoc(doc(db, "saves", `${currentUser.uid}_${rm.dataset.remove}`));
                } catch (err) { /* abaikan */ }
                load();
                return;
            }

            if (e.target.closest("[data-import]") && currentUser) {
                for (const x of localSaved()) {
                    try {
                        const ref = doc(db, "saves", `${currentUser.uid}_${x.id}`);
                        const exists = (await getDoc(ref)).exists();
                        if (!exists) {
                            await setDoc(ref, { articleId: x.id, userId: currentUser.uid, createdAt: serverTimestamp() });
                        }
                    } catch (err) { /* lewati yang gagal */ }
                }
                try { localStorage.removeItem(LOCAL_KEY); } catch (err) { /* abaikan */ }
                load();
            }
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            load();
        });

    </script>

<script type="module" src="../auth-widget.js"></script>
</body>

</html>
