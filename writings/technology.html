<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>

        <h1>Ramdhan's Corner</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="index.html">Writings</a>
        </nav>

    </header>


    <main>

        <section>

            <p class="writing-category">
                02 · TECHNOLOGY & COMPUTER SCIENCE
            </p>

            <h2>Technology & Computer Science 💻</h2>

            <p>
                Tech, programming, gadgets, experiments, and the things I build or break along the way.
            </p>

        </section>


        <section>

            <h2>Articles</h2>

            <div id="article-list">
                <p style="color:var(--text-light); font-size:14px;">
                    Memuat tulisan...
                </p>
            </div>

        </section>


        <p>
            <a
                class="back-link"
                href="index.html"
            >
                ← Back to Writings
            </a>
        </p>

    </main>


    <footer>
        <p>© 2026 Ramdhan</p>
    </footer>


    <script type="module">

        import { db } from "../firebase-config.js";

        import {
            collection,
            query,
            where,
            orderBy,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";


        const CATEGORY = "technology";

        const listEl = document.getElementById("article-list");


        async function loadArticles() {

            try {

                const q = query(
                    collection(db, "writings"),
                    where("category", "==", CATEGORY),
                    orderBy("createdAt", "desc")
                );

                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    listEl.innerHTML = `
                        <article class="writing-card">
                            <p class="writing-category">TECHNOLOGY & COMPUTER SCIENCE</p>
                            <h3>Belum Ada Tulisan</h3>
                            <p>Tulisan pertamaku di kategori ini akan muncul di sini.</p>
                        </article>
                    `;
                    return;
                }

                listEl.innerHTML = "";

                snapshot.forEach((doc) => {

                    const data = doc.data();

                    const card = document.createElement("article");
                    card.className = "writing-card";

                    card.innerHTML = `
                        <p class="writing-category">TECHNOLOGY & COMPUTER SCIENCE</p>
                        <h3>${data.title}</h3>
                        <p>${data.description}</p>
                        <a href="article.html?id=${doc.id}">Read this →</a>
                    `;

                    listEl.appendChild(card);

                });

            } catch (error) {
                listEl.innerHTML = `
                    <p style="color:#e53e3e; font-size:14px;">
                        Gagal memuat tulisan: ${error.message}
                    </p>
                `;
            }

        }

        loadArticles();

    </script>

<script type="module" src="../auth-widget.js"></script>
</body>

</html>
