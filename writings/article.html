<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loading... - Ramdhan's Corner</title>

    <link rel="stylesheet" href="../style.css">

    <style>

        /* =========================
           ARTICLE PHOTOS
        ========================= */

        .article-photos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin: 20px 0 30px;
        }

        .article-photo {
            overflow: hidden;
            border-radius: 14px;
            background: var(--surface-soft);
        }

        .article-photo img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            display: block;
        }


        /* =========================
           REFERENCES
        ========================= */

        .references {
            margin-top: 35px;
        }

        .reference-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reference-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            transition: 0.2s;
        }

        .reference-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .reference-icon {
            width: 38px;
            height: 38px;
            min-width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 18px;
            background: var(--accent);
            color: #ffffff;
        }

        .reference-icon.instagram { background: linear-gradient(45deg, #F58529, #DD2A7B, #8134AF, #515BD4); }
        .reference-icon.youtube   { background: #FF0000; }
        .reference-icon.tiktok    { background: #000000; }
        .reference-icon.threads   { background: #000000; }
        .reference-icon.x         { background: #000000; }
        .reference-icon.journal   { background: #4A5568; }
        .reference-icon.article   { background: var(--accent); }
        .reference-icon.other     { background: var(--text-light); }

        .reference-info { flex: 1; min-width: 0; }

        .reference-info .reference-title {
            font-weight: bold;
            font-size: 14px;
        }

        .reference-info .reference-type {
            font-size: 12px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }


        /* =========================
           ARTICLE TYPOGRAPHY
        ========================= */

        .full-article .writing-category {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .full-article h2 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 24px;
        }

        .full-article p {
            font-size: 16px;
            line-height: 1.75;
            color: var(--text);
            margin-bottom: 16px;
        }

        .full-article .references h3 {
            font-size: 18px;
            font-weight: bold;
        }


        /* =========================
           COMMENTS
        ========================= */

        .comments-section {
            margin-top: 45px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }

        .comments-section h3 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .comment-form {
            display: none;
            gap: 10px;
            margin-bottom: 24px;
        }

        .comment-form textarea {
            width: 100%;
            min-height: 70px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-soft);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 8px;
        }

        .comment-form button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .comment-login-prompt {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .comment-login-prompt a {
            color: var(--accent);
            font-weight: bold;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .comment-item img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .comment-body {
            flex: 1;
            min-width: 0;
        }

        .comment-name {
            font-weight: bold;
            font-size: 14px;
        }

        .comment-text {
            font-size: 14px;
            margin: 4px 0;
            line-height: 1.5;
        }

        .comment-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-light);
        }

        .comment-delete-btn {
            background: none;
            border: none;
            color: #e53e3e;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
        }

    </style>

</head>


<body>

    <header>

        <h1>Ramdhan's Corner</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="index.html">Writings</a>
        </nav>

    </header>


    <main>

        <article class="full-article" id="article-content">

            <p style="color:var(--text-light); font-size:14px;">
                Memuat tulisan...
            </p>

        </article>


        <!-- ==========================================
             COMMENTS
        =========================================== -->

        <section class="comments-section">

            <h3>Comments</h3>

            <p class="comment-login-prompt" id="comment-login-prompt">
                <a href="../account.html">Login dengan Google</a> untuk ikut komentar.
            </p>

            <div class="comment-form" id="comment-form">
                <textarea id="comment-input" placeholder="Tulis komentar..."></textarea>
                <button id="comment-submit-btn">Kirim Komentar</button>
            </div>

            <div id="comment-list">
                <p style="color:var(--text-light); font-size:14px;">
                    Memuat komentar...
                </p>
            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 Ramdhan</p>
    </footer>


    <script type="module">

        import { db, auth } from "../firebase-config.js";

        import {
            doc,
            getDoc,
            collection,
            query,
            where,
            orderBy,
            addDoc,
            deleteDoc,
            onSnapshot,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";


        const ADMIN_EMAIL = "im.raito.id@gmail.com";

        const params = new URLSearchParams(window.location.search);
        const articleId = params.get("id");

        const contentEl = document.getElementById("article-content");

        const loginPrompt = document.getElementById("comment-login-prompt");
        const commentForm = document.getElementById("comment-form");
        const commentInput = document.getElementById("comment-input");
        const commentSubmitBtn = document.getElementById("comment-submit-btn");
        const commentListEl = document.getElementById("comment-list");

        let currentUser = null;


        const REFERENCE_ICONS = {
            instagram: `<svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>`,
            youtube: `<svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`,
            tiktok: `<svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M12.53.02C13.84 0 15.14.01 16.44 0c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>`,
            threads: `<svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M12.186 24h-.007c-3.581-.024-6.334-1.205-8.184-3.509C2.35 18.44 1.5 15.586 1.472 12.01v-.017c.03-3.579.879-6.43 2.525-8.482C5.845 1.205 8.6.024 12.18 0h.014c2.746.02 5.043.725 6.826 2.098 1.677 1.29 2.858 3.13 3.509 5.467l-2.03.569c-1.104-3.96-3.898-5.984-8.317-6.015-2.938.022-5.159.943-6.6 2.735C4.32 6.437 3.617 8.868 3.593 12c.024 3.132.727 5.563 2.09 7.226 1.44 1.792 3.66 2.714 6.6 2.735 2.634-.02 4.377-.646 5.826-2.095 1.652-1.65 1.619-3.673 1.088-4.897-.313-.72-.878-1.319-1.643-1.756-.19 1.358-.611 2.435-1.259 3.209-.87 1.036-2.098 1.601-3.649 1.68-1.178.062-2.312-.217-3.196-.783-1.049-.67-1.663-1.688-1.729-2.865-.13-2.303 1.706-3.958 4.573-4.121a13.69 13.69 0 0 1 2.756.13c-.113-.674-.34-1.21-.68-1.596-.463-.526-1.181-.792-2.134-.797h-.041c-.769 0-1.81.213-2.475 1.226l-1.734-1.185c.892-1.352 2.343-2.098 4.09-2.098h.055c2.966.018 4.732 1.827 4.909 5.005.101.043.201.088.3.135 1.4.66 2.424 1.665 2.961 2.906.744 1.721.812 4.526-1.464 6.799-1.822 1.822-4.03 2.65-7.152 2.673Zm1.276-9.822c-.234-.008-.474-.007-.716.005-1.756.099-2.85.949-2.788 2.166.032.626.35 1.164.895 1.516.522.337 1.204.512 1.926.474 1.184-.062 2.086-.512 2.61-1.302.401-.6.6-1.375.646-2.474-.878-.226-1.685-.353-2.573-.385Z"/></svg>`,
            x: `<svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
            journal: `<svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 1.5L18.5 9H13V3.5zM8 13h8v1.5H8V13zm0 3h8v1.5H8V16zm0-6h5v1.5H8V10z"/></svg>`,
            article: `<svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 1.5L18.5 9H13V3.5zM8 13h8v1.5H8V13zm0 3h8v1.5H8V16zm0-6h5v1.5H8V10z"/></svg>`,
            other: `<svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>`
        };


        async function loadArticle() {

            if (!articleId) {
                contentEl.innerHTML = `<p>Tulisan tidak ditemukan.</p>`;
                return;
            }

            try {

                const snap = await getDoc(doc(db, "writings", articleId));

                if (!snap.exists()) {
                    contentEl.innerHTML = `<p>Tulisan tidak ditemukan.</p>`;
                    return;
                }

                const data = snap.data();

                document.title = `${data.title} - Ramdhan's Corner`;

                // Foto-foto
                let photosHtml = "";
                if (data.photos && data.photos.length > 0) {
                    photosHtml = `<div class="article-photos">`;
                    data.photos.forEach(url => {
                        photosHtml += `
                            <figure class="article-photo">
                                <img src="${url}" alt="${data.title}">
                            </figure>
                        `;
                    });
                    photosHtml += `</div>`;
                }

                // Isi tulisan (pisah per baris jadi paragraf)
                const paragraphs = data.content
                    .split("\n")
                    .filter(p => p.trim())
                    .map(p => `<p>${p}</p>`)
                    .join("");

                // Referensi
                let referencesHtml = "";
                if (data.references && data.references.length > 0) {
                    referencesHtml = `
                        <div class="references">
                            <h3>Referensi</h3>
                            <div class="reference-list">
                    `;
                    data.references.forEach(ref => {
                        const icon = REFERENCE_ICONS[ref.type] || "🔗";
                        referencesHtml += `
                            <a href="${ref.url}" target="_blank" rel="noopener" class="reference-card">
                                <div class="reference-icon ${ref.type}">${icon}</div>
                                <div class="reference-info">
                                    <p class="reference-title">${ref.title}</p>
                                    <p class="reference-type">${ref.type}</p>
                                </div>
                            </a>
                        `;
                    });
                    referencesHtml += `</div></div>`;
                }

                const categoryLabel = data.category
                    ? data.category.toUpperCase()
                    : "";

                contentEl.innerHTML = `
                    <p class="writing-category">${categoryLabel}</p>
                    <h2>${data.title}</h2>
                    ${photosHtml}
                    ${paragraphs}
                    ${referencesHtml}
                    <p style="margin-top:30px;">
                        <a class="back-link" href="${data.category}.html">← Back to ${categoryLabel}</a>
                    </p>
                `;

            } catch (error) {
                contentEl.innerHTML = `<p style="color:#e53e3e;">Gagal memuat tulisan: ${error.message}</p>`;
            }

        }

        loadArticle();


        // ==========================================
        // COMMENTS LOGIC
        // ==========================================

        onAuthStateChanged(auth, (user) => {

            currentUser = user;

            if (user) {
                loginPrompt.style.display = "none";
                commentForm.style.display = "flex";
                commentForm.style.flexDirection = "column";
            } else {
                loginPrompt.style.display = "block";
                commentForm.style.display = "none";
            }

        });


        function renderComments(snapshot) {

            if (snapshot.empty) {
                commentListEl.innerHTML = `
                    <p style="color:var(--text-light); font-size:14px;">
                        Belum ada komentar. Jadi yang pertama!
                    </p>
                `;
                return;
            }

            commentListEl.innerHTML = "";

            snapshot.forEach((docSnap) => {

                const c = docSnap.data();

                const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                const date = c.createdAt
                    ? c.createdAt.toDate().toLocaleDateString("id-ID", {
                        day: "numeric", month: "short", year: "numeric"
                      })
                    : "";

                const item = document.createElement("div");
                item.className = "comment-item";

                item.innerHTML = `
                    <img src="${c.userPhoto || ''}" alt="${c.userName}">
                    <div class="comment-body">
                        <p class="comment-name">${c.userName}</p>
                        <p class="comment-text">${c.text}</p>
                        <div class="comment-meta">
                            <span>${date}</span>
                            ${isAdmin ? `<button class="comment-delete-btn" data-id="${docSnap.id}">Hapus</button>` : ""}
                        </div>
                    </div>
                `;

                commentListEl.appendChild(item);

            });

            // pasang listener hapus (cuma admin yang punya tombolnya)
            commentListEl.querySelectorAll(".comment-delete-btn").forEach(btn => {
                btn.addEventListener("click", async () => {
                    if (confirm("Hapus komentar ini?")) {
                        await deleteDoc(doc(db, "comments", btn.dataset.id));
                    }
                });
            });

        }


        if (articleId) {

            const commentsQuery = query(
                collection(db, "comments"),
                where("articleId", "==", articleId),
                orderBy("createdAt", "desc")
            );

            onSnapshot(commentsQuery, renderComments, (error) => {
                commentListEl.innerHTML = `
                    <p style="color:#e53e3e; font-size:14px;">
                        Gagal memuat komentar: ${error.message}
                    </p>
                `;
            });

        }


        commentSubmitBtn.addEventListener("click", async () => {

            const text = commentInput.value.trim();

            if (!text || !currentUser || !articleId) return;

            commentSubmitBtn.disabled = true;

            try {

                await addDoc(collection(db, "comments"), {
                    articleId: articleId,
                    text: text,
                    userName: currentUser.displayName || currentUser.email,
                    userPhoto: currentUser.photoURL || "",
                    createdAt: serverTimestamp()
                });

                commentInput.value = "";

            } catch (error) {
                alert("Gagal mengirim komentar: " + error.message);
            }

            commentSubmitBtn.disabled = false;

        });

    </script>

</body>

</html>
