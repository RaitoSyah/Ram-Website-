        /* =========================
           ARTICLE PHOTOS
        ========================= */

        .article-photos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin: 20px 0 30px;
        }

        .article-photo {
            overflow: hidden;
            border-radius: 14px;
            background: var(--surface-soft);
        }

        .article-photo img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            display: block;
        }


        /* =========================
           REFERENCES
        ========================= */

        .references {
            margin-top: 35px;
        }

        .reference-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reference-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            transition: 0.2s;
        }

        .reference-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .reference-icon {
            width: 38px;
            height: 38px;
            min-width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 18px;
            background: var(--accent);
            color: #ffffff;
        }

        .reference-icon.instagram { background: linear-gradient(45deg, #F58529, #DD2A7B, #8134AF, #515BD4); }
        .reference-icon.youtube   { background: #FF0000; }
        .reference-icon.tiktok    { background: #000000; }
        .reference-icon.threads   { background: #000000; }
        .reference-icon.x         { background: #000000; }
        .reference-icon.journal   { background: #4A5568; }
        .reference-icon.article   { background: var(--accent); }
        .reference-icon.other     { background: var(--text-light); }

        .reference-info { flex: 1; min-width: 0; }

        .reference-info .reference-title {
            font-weight: bold;
            font-size: 14px;
        }

        .reference-info .reference-type {
            font-size: 12px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }


        /* =========================
           ARTICLE TYPOGRAPHY
        ========================= */

        .full-article .writing-category {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .full-article h2 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 24px;
        }

        .full-article p {
            font-size: 16px;
            line-height: 1.75;
            color: var(--text);
            margin-bottom: 16px;
        }

        .full-article .references h3 {
            font-size: 18px;
            font-weight: bold;
        }


        /* =========================
           COMMENTS
        ========================= */

        .comments-section {
            margin-top: 45px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }

        .comments-section h3 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .comment-form {
            display: none;
            gap: 10px;
            margin-bottom: 24px;
        }

        .comment-form textarea {
            width: 100%;
            min-height: 70px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-soft);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 8px;
        }

        .comment-form button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .comment-login-prompt {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .comment-login-prompt a {
            color: var(--accent);
            font-weight: bold;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .comment-item img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .comment-body {
            flex: 1;
            min-width: 0;
        }

        .comment-name {
            font-weight: bold;
            font-size: 14px;
        }

        .comment-text {
            font-size: 14px;
            margin: 4px 0;
            line-height: 1.5;
        }

        .comment-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-light);
        }

        .comment-delete-btn {
            background: none;
            border: none;
            color: #e53e3e;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
        }

        .full-article .rich-content h4 { font-size: 17px; font-weight: 700; line-height: 1.3; margin: 24px 0 8px; }

        .full-article .rich-content blockquote { border-left: 4px solid var(--accent); margin: 20px 0; padding: 4px 0 4px 16px; font-style: italic; color: var(--text-light); }
        .full-article .rich-content a { color: var(--accent); text-decoration: underline; word-break: break-word; }
        .full-article .rich-content .ql-align-center { text-align: center; }
        .full-article .rich-content .ql-align-right { text-align: right; }
        .full-article .rich-content .ql-align-justify { text-align: justify; }

        .related-section { margin-top: 48px; }
        .related-section h3 { font-size: 20px; margin: 0 0 16px; }
        .related-meta { font-size: 13px; color: var(--text-light); margin: 0 0 8px; }

        .draft-banner { padding: 10px 14px; border: 1px dashed var(--accent); border-radius: 8px; font-size: 13px; margin: 0 0 20px; }

        .comment-text { white-space: pre-wrap; overflow-wrap: anywhere; }
        .comment-name { overflow-wrap: anywhere; }

        /* ---- DISCLAIMER (satu baris tipis, bisa dibuka) ---- */
        .disclaimer { margin: 0 0 24px; border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; background: var(--surface-soft); }
        .disclaimer summary { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; font-size: 13px; list-style: none; }
        .disclaimer summary::-webkit-details-marker { display: none; }
        .disclaimer summary::after { content: "▾"; margin-left: auto; color: var(--text-light); transition: transform 0.2s; }
        .disclaimer[open] summary::after { transform: rotate(180deg); }
        .disclaimer summary strong { letter-spacing: 0.5px; }
        .disclaimer-hint { color: var(--text-muted); }
        .disclaimer summary:focus-visible { outline: 3px solid var(--accent-hover); outline-offset: 2px; border-radius: 8px; }
        .disclaimer-body { padding: 4px 14px 8px; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.7; color: var(--text-muted); }
        .disclaimer-body p { margin: 12px 0; }

        /* ---- BAR AKSI: suka, bagikan, simpan ---- */
        .action-bar { display: none; flex-wrap: wrap; gap: 10px; margin: 16px 0 25px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
        .act { position: relative; flex: 1 1 0; min-width: 88px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin: 0; padding: 12px 6px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-soft); color: var(--text); font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer; transition: border-color 0.2s, background 0.2s, transform 0.1s; }
        .act:hover { background: var(--surface-soft); border-color: var(--accent-hover); }
        .act:active { transform: scale(0.97); }
        .act:focus-visible { outline: 3px solid var(--accent-hover); outline-offset: 2px; }
        .act svg { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: fill 0.2s, stroke 0.2s; }
        .act-like.liked { border-color: #e0526b; }
        .act-like.liked svg { fill: #e0526b; stroke: #e0526b; }
        .act-save.saved { border-color: var(--accent-hover); }
        .act-save.saved svg { fill: var(--accent-hover); stroke: var(--accent-hover); }
        .act.pop svg { animation: actPop 0.45s cubic-bezier(.2, 1.6, .4, 1); }
        .burst { position: absolute; left: 21px; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #e0526b; pointer-events: none; animation: burstOut 0.6s ease-out forwards; }
        .act-msg { flex: 1 0 100%; min-height: 0; margin: 0; font-size: 13px; color: var(--text-muted); text-align: center; }
        .act-msg:empty { display: none; }
        .act-msg a { color: var(--accent-hover); font-weight: bold; }
        @keyframes actPop { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
        @keyframes burstOut { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; } }
        @media (prefers-reduced-motion: reduce) {
            .act, .act svg { transition: none; }
            .act.pop svg, .burst { animation: none; }
        }
    </style>

                const section = document.getElementById("related-section");
                const listEl = document.getElementById("related-list");
                const escR = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

                // Tulisan lama belum punya tags: kategorinya dipakai sebagai tag sementara
                const effTags = (d) => Array.isArray(d.tags) && d.tags.length
                    ? d.tags.map(t => String(t).toLowerCase())
                    : (d.category ? [String(d.category).toLowerCase()] : []);

                const mine = effTags(data);
                if (!mine.length) return;

                const probe = mine.slice(0, 10);

                const results = await Promise.allSettled([
                    getDocs(query(collection(db, "writings"), where("tags", "array-contains-any", probe), limit(30))),
                    getDocs(query(collection(db, "writings"), where("category", "in", probe), limit(30)))
                ]);

                const found = new Map();

                results.forEach(r => {
                    if (r.status !== "fulfilled") return;
                    r.value.forEach(d => {
                        if (d.id === currentId || found.has(d.id)) return;
                        const x = d.data();
                        const score = effTags(x).filter(t => mine.includes(t)).length;
                        if (score > 0) found.set(d.id, { id: d.id, data: x, score });
                    });
                });

                const ms = (x) => x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : 0;

                // Paling banyak tag yang sama dulu; kalau sama, yang terbaru
                const top = [...found.values()]
                    .sort((p, q) => q.score - p.score || ms(q.data) - ms(p.data))
                    .slice(0, 3);

                if (!top.length) return;

                listEl.innerHTML = top.map(({ id, data: x }) => {
                    const dt = x.createdAt && x.createdAt.toDate
                        ? x.createdAt.toDate().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })
                        : "";
                    const w = (x.contentText ?? x.content ?? "").trim().split(/\s+/).filter(Boolean).length;
                    const meta = (dt ? dt + " · " : "") + Math.max(1, Math.ceil(w / 250)) + " min read";
                    return `
                        <article class="writing-card">
                            <h3>${escR(x.title)}</h3>
                            <p class="related-meta">${escR(meta)}</p>
                            <p>${escR(x.description)}</p>
                            <a href="article.html?id=${encodeURIComponent(id)}">Read this →</a>
                        </article>
                    `;
                }).join("");

                section.style.display = "block";

            } catch (e) {
                // Rekomendasi bersifat tambahan: kalau gagal, bagian ini cukup disembunyikan
            }
        }


        async function loadArticle() {

            if (!articleId) {
                contentEl.innerHTML = `<p>Tulisan tidak ditemukan.</p>`;
                return;
            }

            try {

                const snap = await getDoc(doc(db, isDraft ? "drafts" : "writings", articleId));

                if (!snap.exists()) {
                    contentEl.innerHTML = `<p>Tulisan tidak ditemukan.</p>`;
                    return;
                }

                const data = snap.data();

                document.title = `${data.title} - Ramdhan's Corner`;

                // Foto-foto
                let photosHtml = "";
                if (data.photos && data.photos.length > 0) {
                    photosHtml = `<div class="article-photos">`;
                    data.photos.forEach(url => {
                        photosHtml += `
                            <figure class="article-photo">
                                <img src="${url}" alt="${data.title}">
                            </figure>
                        `;
                    });
                    photosHtml += `</div>`;
                }

                // Isi tulisan
                let paragraphs;

                if (data.contentFormat === "html") {
                    // Tulisan dari editor baru: font didaftarkan, HTML disaring dulu sebelum ditampilkan
                    await loadCustomFonts();
                    const clean = sanitizeRich(data.content || "");
                    paragraphs = clean === null
                        ? "<p>Isi tulisan tidak dapat ditampilkan. Muat ulang halaman.</p>"
                        : `<div class="rich-content">${clean}</div>`;
                } else {
                    // Tulisan lama (teks biasa): pisah per baris jadi paragraf
                    paragraphs = (data.content || "")
                        .split("\n")
                        .filter(p => p.trim())
                        .map(p => `<p>${p}</p>`)
                        .join("");
                }

                // Referensi
                let referencesHtml = "";
                if (data.references && data.references.length > 0) {
                    referencesHtml = `
                        <div class="references">
                            <h3>Referensi</h3>
                            <div class="reference-list">
                    `;
                    data.references.forEach(ref => {
                        const icon = REFERENCE_ICONS[ref.type] || "🔗";
                        referencesHtml += `
                            <a href="${ref.url}" target="_blank" rel="noopener" class="reference-card">
                                <div class="reference-icon ${ref.type}">${icon}</div>
                                <div class="reference-info">
                                    <p class="reference-title">${ref.title}</p>
                                    <p class="reference-type">${ref.type}</p>
                                </div>
                            </a>
                        `;
                    });
                    referencesHtml += `</div></div>`;
                }

                const esc = (t) => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

                // Tanggal publikasi (dari createdAt yang sudah ada)
                const dateText = data.createdAt
                    ? data.createdAt.toDate().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })
                    : "";

                // Perkiraan waktu baca: kata / 250, dibulatkan ke atas
                const words = (data.contentText ?? data.content ?? "").trim().split(/\s+/).filter(Boolean).length;
                const minutes = Math.max(1, Math.ceil(words / 250));

                const updatedText = data.updatedAt && data.updatedAt.toDate
                    ? data.updatedAt.toDate().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })
                    : "";

                const metaParts = [];
                if (isDraft) metaParts.push("Draft");
                else if (dateText) metaParts.push("Published " + dateText);
                if (!isDraft && updatedText && updatedText !== dateText) metaParts.push("Updated " + updatedText);
                metaParts.push(minutes + " min read");

                const metaHtml = `<p class="article-meta">${metaParts.join(" · ")}</p>`;

                // Tags (artikel lama belum punya tags)
                const tags = Array.isArray(data.tags) ? data.tags : [];
                const tagsHtml = tags.length
                    ? `<div class="article-tags">${tags.map(t => `<a href="all.html?tag=${encodeURIComponent(t)}">${esc(t)}</a>`).join("")}</div>`
                    : "";

                // Label & tombol kembali: pakai kategori lama kalau ada, kalau tidak ke daftar tulisan
                const categoryLabel = data.category ? data.category.toUpperCase() : "WRITING";
                const backHref = "all.html";
                const backLabel = "All Writings";

                // Peringatan: satu baris tipis, diketuk untuk membuka teks lengkapnya
                const disclaimerHtml = `
                    <details class="disclaimer">
                        <summary>
                            <span><strong>⚠️ ${esc(DISCLAIMER.title)}</strong> <span class="disclaimer-hint">· ${esc(DISCLAIMER.hint)}</span></span>
                        </summary>
                        <div class="disclaimer-body">
                            ${DISCLAIMER.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}
                        </div>
                    </details>
                `;

                contentEl.innerHTML = `
                    ${isDraft ? '<p class="draft-banner">DRAFT · Pratinjau, belum terbit. Hanya kamu yang bisa melihat ini.</p>' : ""}
                    <p class="writing-category">${categoryLabel}</p>
                    <h2>${esc(data.title)}</h2>
                    ${metaHtml}
                    ${tagsHtml}
                    ${disclaimerHtml}
                    ${photosHtml}
                    ${paragraphs}
                    ${referencesHtml}
                    <p style="margin-top:30px;">
                        <a class="back-link" href="${backHref}">← Back to ${backLabel}</a>
                    </p>
                `;

                // Warna teks pilihan penulis dijaga tetap terbaca di tema yang aktif
                applyContrastGuard(contentEl);
                window.addEventListener("themechange", () => applyContrastGuard(contentEl));

                if (!isDraft) {
                    loadRelated(snap.id, data);
                    initActions(snap.id, data.title);
                }

            } catch (error) {
                if (error && error.code === "permission-denied") {
                    contentEl.innerHTML = `<p>Tulisan tidak ditemukan.</p>`;
                } else {
                    contentEl.innerHTML = `<p style="color:#e53e3e;">Gagal memuat tulisan: ${escHtml(error.message)}</p>`;
                }
            }

        }

        loadArticle();


        // ==========================================
        // BAR AKSI: SUKA, BAGIKAN, SIMPAN
        // Suka   : likes/{idTulisan}_{uid} di Firestore (perlu login)
        // Bagikan: lembar bagikan bawaan HP, atau salin tautan
        // Simpan : saves/{uid}_{idTulisan} di Firestore, per akun (perlu login), dilihat di saved.html
        // ==========================================

        const actionBar = document.getElementById("action-bar");
        const likeBtn = document.getElementById("like-btn");
        const likeCount = document.getElementById("like-count");
        const shareBtn = document.getElementById("share-btn");
        const saveBtn = document.getElementById("save-btn");
        const saveLabel = document.getElementById("save-label");
        const actMsg = document.getElementById("act-msg");

        const likeState = { id: null, count: 0, liked: false, busy: false };
        let actionTitle = "";

        function setMsg(text, href, linkText) {
            actMsg.textContent = text || "";
            if (href) {
                actMsg.appendChild(document.createTextNode(" "));
                const a = document.createElement("a");
                a.href = href;
                a.textContent = linkText;
                actMsg.appendChild(a);
            }
        }

        function popIcon(btn) {
            btn.classList.remove("pop");
            void btn.offsetWidth; // mulai ulang animasi
            btn.classList.add("pop");
        }

        function burst(btn) {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            const n = 7;
            for (let i = 0; i < n; i++) {
                const p = document.createElement("i");
                p.className = "burst";
                const ang = (Math.PI * 2 * i) / n;
                p.style.setProperty("--dx", Math.cos(ang) * 30 + "px");
                p.style.setProperty("--dy", Math.sin(ang) * 30 + "px");
                btn.appendChild(p);
                setTimeout(() => p.remove(), 650);
            }
        }

        // ---------- SUKA ----------

        function renderLike() {
            likeCount.textContent = likeState.count;
            likeBtn.classList.toggle("liked", likeState.liked);
            likeBtn.setAttribute("aria-pressed", String(likeState.liked));
            likeBtn.setAttribute(
                "aria-label",
                (likeState.liked ? "Batalkan suka. " : "Suka tulisan ini. ") + likeState.count + " suka"
            );
        }

        async function refreshLikedState() {

            if (!likeState.id) return;

            if (!currentUser) {
                likeState.liked = false;
                renderLike();
                return;
            }

            try {
                const s = await getDoc(doc(db, "likes", `${likeState.id}_${currentUser.uid}`));
                likeState.liked = s.exists();
                renderLike();
            } catch (e) { /* abaikan: tombol tetap bisa dipakai */ }
        }

        async function initLikes(articleId) {

            likeState.id = articleId;

            try {
                const snap = await getCountFromServer(
                    query(collection(db, "likes"), where("articleId", "==", articleId))
                );
                likeState.count = snap.data().count;
                likeBtn.style.display = "";
                renderLike();
                await refreshLikedState();
            } catch (e) {
                // Aturan Firestore belum dipasang atau gagal memuat: tombol suka disembunyikan,
                // bagikan dan simpan tetap berfungsi
            }
        }

        likeBtn.addEventListener("click", async () => {

            if (!likeState.id || likeState.busy) return;

            if (!currentUser) {
                setMsg("Masuk dulu untuk menyukai tulisan ini.");
                const trigger = document.querySelector(".auth-widget-trigger");
                if (trigger) trigger.click();
                return;
            }

            likeState.busy = true;
            setMsg("");

            const ref = doc(db, "likes", `${likeState.id}_${currentUser.uid}`);

            try {
                if (likeState.liked) {
                    await deleteDoc(ref);
                    likeState.liked = false;
                    likeState.count = Math.max(0, likeState.count - 1);
                } else {
                    await setDoc(ref, {
                        articleId: likeState.id,
                        userId: currentUser.uid,
                        createdAt: serverTimestamp()
                    });
                    likeState.liked = true;
                    likeState.count += 1;
                    popIcon(likeBtn);
                    burst(likeBtn);
                }
                renderLike();
            } catch (e) {
                setMsg("Gagal menyimpan suka. Coba lagi nanti.");
            } finally {
                likeState.busy = false;
            }
        });

        // ---------- BAGIKAN ----------

        // Tautan yang selalu langsung menuju tulisan ini (tanpa parameter lain)
        function shareUrl() {
            const u = new URL(location.href);
            u.search = "?id=" + encodeURIComponent(likeState.id);
            u.hash = "";
            return u.href;
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (e) {
                try {
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    ta.setAttribute("readonly", "");
                    ta.style.position = "fixed";
                    ta.style.opacity = "0";
                    document.body.appendChild(ta);
                    ta.select();
                    const ok = document.execCommand("copy");
                    ta.remove();
                    return ok;
                } catch (e2) {
                    return false;
                }
            }
        }

        shareBtn.addEventListener("click", async () => {

            if (!likeState.id) return;

            const url = shareUrl();

            // HP: lembar bagikan bawaan (WhatsApp, dan lainnya)
            if (navigator.share) {
                try {
                    await navigator.share({ title: actionTitle, text: actionTitle, url });
                    return;
                } catch (e) {
                    if (e && e.name === "AbortError") return; // dibatalkan pengguna
                }
            }

            // Cadangan: salin tautan
            const ok = await copyText(url);
            setMsg(ok ? "Tautan disalin." : "Tidak bisa menyalin otomatis. Salin dari kolom alamat browser.");
            setTimeout(() => setMsg(""), 4000);
        });

        // ---------- SIMPAN (per akun) ----------

        const saveState = { saved: false, busy: false };

        function renderSave() {
            saveBtn.classList.toggle("saved", saveState.saved);
            saveBtn.setAttribute("aria-pressed", String(saveState.saved));
            saveLabel.textContent = saveState.saved ? "Tersimpan" : "Simpan";
        }

        async function refreshSavedState() {

            if (!likeState.id) return;

            if (!currentUser) {
                saveState.saved = false;
                renderSave();
                return;
            }

            try {
                const s = await getDoc(doc(db, "saves", `${currentUser.uid}_${likeState.id}`));
                saveState.saved = s.exists();
                renderSave();
            } catch (e) { /* abaikan: tombol tetap bisa dipakai */ }
        }

        saveBtn.addEventListener("click", async () => {

            if (!likeState.id || saveState.busy) return;

            if (!currentUser) {
                setMsg("Masuk dulu untuk menyimpan tulisan ini.");
                const trigger = document.querySelector(".auth-widget-trigger");
                if (trigger) trigger.click();
                return;
            }

            saveState.busy = true;
            setMsg("");

            const ref = doc(db, "saves", `${currentUser.uid}_${likeState.id}`);

            try {
                if (saveState.saved) {
                    await deleteDoc(ref);
                    saveState.saved = false;
                    renderSave();
                    setMsg("Dihapus dari simpanan.");
                } else {
                    await setDoc(ref, {
                        articleId: likeState.id,
                        userId: currentUser.uid,
                        createdAt: serverTimestamp()
                    });
                    saveState.saved = true;
                    renderSave();
                    popIcon(saveBtn);
                    setMsg("Disimpan di akunmu.", "saved.html", "Lihat tersimpan");
                }
            } catch (e) {
                setMsg("Gagal menyimpan. Coba lagi nanti.");
            } finally {
                saveState.busy = false;
            }
        });

        function initActions(articleId, title) {
            likeState.id = articleId;
            actionTitle = title || document.title;
            actionBar.style.display = "flex";
            renderSave();
            refreshSavedState();
            initLikes(articleId);
        }


        // ==========================================
        // COMMENTS LOGIC
        // ==========================================

        onAuthStateChanged(auth, (user) => {

            currentUser = user;

            refreshLikedState();
            refreshSavedState();

            if (user) {
                loginPrompt.style.display = "none";
                commentForm.style.display = "flex";
                commentForm.style.flexDirection = "column";
            } else {
                loginPrompt.style.display = "block";
                commentForm.style.display = "none";
            }

        });


        // Teks dari luar (pesan error, dll) tidak boleh masuk ke HTML mentah
        function escHtml(t) {
            return String(t ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        // Foto profil kosong/tidak valid diganti lingkaran abu-abu
        const AVATAR_FALLBACK = "data:image/svg+xml," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#9aa4b0"/></svg>'
        );

        function renderComments(snapshot) {

            if (snapshot.empty) {
                commentListEl.innerHTML = `
                    <p style="color:var(--text-light); font-size:14px;">
                        Belum ada komentar. Jadi yang pertama!
                    </p>
                `;
                return;
            }

            commentListEl.innerHTML = "";

            snapshot.forEach((docSnap) => {

                const c = docSnap.data();

                const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                const date = c.createdAt
                    ? c.createdAt.toDate().toLocaleDateString("id-ID", {
                        day: "numeric", month: "short", year: "numeric"
                      })
                    : "";

                const item = document.createElement("div");
                item.className = "comment-item";

                // Semua teks komentar dimasukkan sebagai TEKS, jadi kode di dalamnya tidak pernah dijalankan
                const img = document.createElement("img");
                const photo = String(c.userPhoto || "");
                img.src = /^https:\/\//i.test(photo) ? photo : AVATAR_FALLBACK;
                img.alt = String(c.userName || "");
                img.referrerPolicy = "no-referrer";

                const body = document.createElement("div");
                body.className = "comment-body";

                const nameEl = document.createElement("p");
                nameEl.className = "comment-name";
                nameEl.textContent = String(c.userName || "");

                const textEl = document.createElement("p");
                textEl.className = "comment-text";
                textEl.textContent = String(c.text || "");

                const meta = document.createElement("div");
                meta.className = "comment-meta";

                const dateEl = document.createElement("span");
                dateEl.textContent = date;
                meta.appendChild(dateEl);

                // Tombol hapus hanya dibuat untuk admin
                if (isAdmin) {
                    const delBtn = document.createElement("button");
                    delBtn.className = "comment-delete-btn";
                    delBtn.textContent = "Hapus";
                    delBtn.addEventListener("click", async () => {
                        if (confirm("Hapus komentar ini?")) {
                            await deleteDoc(doc(db, "comments", docSnap.id));
                        }
                    });
                    meta.appendChild(delBtn);
                }

                body.appendChild(nameEl);
                body.appendChild(textEl);
                body.appendChild(meta);

                item.appendChild(img);
                item.appendChild(body);

                commentListEl.appendChild(item);

            });

        }


        if (articleId) {

            const commentsQuery = query(
                collection(db, "comments"),
                where("articleId", "==", articleId),
                orderBy("createdAt", "desc")
            );

            onSnapshot(commentsQuery, renderComments, (error) => {
                commentListEl.innerHTML = `
                    <p style="color:#e53e3e; font-size:14px;">
                        Gagal memuat komentar: ${escHtml(error.message)}
                    </p>
                `;
            });

        }


        commentSubmitBtn.addEventListener("click", async () => {

            const text = commentInput.value.trim();

            if (!text || !currentUser || !articleId) return;

            commentSubmitBtn.disabled = true;

            try {

                await addDoc(collection(db, "comments"), {
                    articleId: articleId,
                    text: text.slice(0, 1000),
                    userName: currentUser.displayName || currentUser.email,
                    userPhoto: currentUser.photoURL || "",
                    userId: currentUser.uid,
                    createdAt: serverTimestamp()
                });

                commentInput.value = "";

            } catch (error) {
                alert("Gagal mengirim komentar: " + error.message);
            }

            commentSubmitBtn.disabled = false;

        });

    </script>

  <script type="module" src="../auth-widget.js"></script>
</body>

</html>
