<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loading... - Raito Syah</title>

      <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QSZT4P4PVP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QSZT4P4PVP');
    </script>

    <link rel="stylesheet" href="../style.css">

    <style>

        .waifu-photos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin: 0 0 30px;
        }

        .waifu-photos img {
            width: 100%;
            border-radius: 14px;
            display: block;
        }

        .photo-tab-panel[data-panel="icon"] img {
            aspect-ratio: 1/1;
            object-fit: cover;
        }

        .photo-tab-panel[data-panel="potret"] img {
            max-height: 480px;
            object-fit: contain;
            background: var(--surface-soft);
        }

        .waifu-source-tag {
            display: inline-block;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .waifu-section {
            margin-top: 28px;
        }

        .waifu-section h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .waifu-quotes {
            font-style: italic;
            padding: 14px 18px;
            border-left: 3px solid var(--accent);
            background: var(--surface-soft);
            border-radius: 8px;
        }


        /* =========================
           PHOTO TABS (Icon / Potret)
        ========================= */

        .photo-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .photo-tab-btn {
            padding: 10px 18px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            font-weight: bold;
            font-size: 14px;
            color: var(--text-light);
            cursor: pointer;
        }

        .photo-tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .photo-tab-panel {
            display: none;
        }

        .photo-tab-panel.active {
            display: grid;
        }

    </style>

</head>


<body>

    <header>

        <h1>Ramdhan's Corner</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="index.html">Fun Stuff</a>
        </nav>

    </header>


    <main>

        <article id="waifu-content">

            <p style="color:var(--text-light); font-size:14px;">
                Memuat...
            </p>

        </article>

    </main>


    <footer>
        <p>© 2026 Ramdhan</p>
    </footer>


    <script type="module">

        import { db } from "../firebase-config.js";

        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";


        const params = new URLSearchParams(window.location.search);
        const waifuId = params.get("id");

        const contentEl = document.getElementById("waifu-content");


        async function loadWaifu() {

            if (!waifuId) {
                contentEl.innerHTML = `<p>Karakter tidak ditemukan.</p>`;
                return;
            }

            try {

                const snap = await getDoc(doc(db, "waifu", waifuId));

                if (!snap.exists()) {
                    contentEl.innerHTML = `<p>Karakter tidak ditemukan.</p>`;
                    return;
                }

                const data = snap.data();

                document.title = `${data.name} - Ramdhan's Corner`;

                let tabsHtml = "";

                const hasIcon = data.icon && data.icon.length > 0;
                const hasPhotos = data.photos && data.photos.length > 0;

                if (hasIcon || hasPhotos) {

                    let iconGrid = "";
                    if (hasIcon) {
                        data.icon.forEach(url => {
                            iconGrid += `<img src="${url}" alt="${data.name}">`;
                        });
                    }

                    let potretGrid = "";
                    if (hasPhotos) {
                        data.photos.forEach(url => {
                            potretGrid += `<img src="${url}" alt="${data.name}">`;
                        });
                    }

                    tabsHtml = `
                        <div class="photo-tabs">
                            ${hasIcon ? `<button class="photo-tab-btn active" data-tab="icon">Icon</button>` : ""}
                            ${hasPhotos ? `<button class="photo-tab-btn ${!hasIcon ? "active" : ""}" data-tab="potret">Potret</button>` : ""}
                        </div>

                        ${hasIcon ? `<div class="waifu-photos photo-tab-panel active" data-panel="icon">${iconGrid}</div>` : ""}
                        ${hasPhotos ? `<div class="waifu-photos photo-tab-panel ${!hasIcon ? "active" : ""}" data-panel="potret">${potretGrid}</div>` : ""}
                    `;

                }

                let bioHtml = "";
                if (data.bio) {
                    bioHtml = `
                        <div class="waifu-section">
                            <h3>Bio</h3>
                            <p>${data.bio}</p>
                        </div>
                    `;
                }

                let whyLikeHtml = "";
                if (data.whyLike) {
                    whyLikeHtml = `
                        <div class="waifu-section">
                            <h3>Kenapa Aku Suka</h3>
                            <p>${data.whyLike}</p>
                        </div>
                    `;
                }

                let quotesHtml = "";
                if (data.quotes) {
                    quotesHtml = `
                        <div class="waifu-section">
                            <h3>Quotes / Trivia</h3>
                            <p class="waifu-quotes">${data.quotes}</p>
                        </div>
                    `;
                }

                contentEl.innerHTML = `
                    <p class="waifu-source-tag">${data.source}</p>
                    <h2>${data.name}</h2>
                    ${tabsHtml}
                    ${bioHtml}
                    ${whyLikeHtml}
                    ${quotesHtml}
                    <p style="margin-top:30px;">
                        <a class="back-link" href="index.html">← Back to Fun Stuff</a>
                    </p>
                `;

                // Pasang listener buat tab switcher
                contentEl.querySelectorAll(".photo-tab-btn").forEach(btn => {
                    btn.addEventListener("click", () => {

                        const tab = btn.dataset.tab;

                        contentEl.querySelectorAll(".photo-tab-btn").forEach(b => b.classList.remove("active"));
                        contentEl.querySelectorAll(".photo-tab-panel").forEach(p => p.classList.remove("active"));

                        btn.classList.add("active");
                        contentEl.querySelector(`.photo-tab-panel[data-panel="${tab}"]`).classList.add("active");

                    });
                });

            } catch (error) {
                contentEl.innerHTML = `<p style="color:#e53e3e;">Gagal memuat: ${error.message}</p>`;
            }

        }

        loadWaifu();

    </script>

  <script type="module" src="../auth-widget.js"></script>
</body>

</html>
