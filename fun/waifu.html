    <link rel="stylesheet" href="../style.css">

    <style>

        .waifu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }

        .waifu-card {
            display: block;
            text-decoration: none;
            color: var(--text);
            border-radius: 14px;
            overflow: hidden;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            transition: 0.2s;
        }

        .waifu-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .waifu-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
        }

        .waifu-card-info {
            padding: 10px 12px;
        }

        .waifu-card-info h3 {
            font-size: 14px;
            margin: 0 0 2px;
        }

        .waifu-card-info p {
            font-size: 12px;
            color: var(--text-light);
            margin: 0;
        }

        .coming-soon {
            color: var(--text-light);
            font-size: 14px;
        }

    </style>

</head>


<body>

    <header>

        <h1>Ramdhan's Corner</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="index.html">Fun Stuff</a>
        </nav>

    </header>


    <main>

        <section class="hero">

            <p class="greeting">MY WAIFU</p>

            <h2>A Personal Collection. 💙</h2>

            <p class="hero-text">
                Karakter-karakter yang aku suka, dari berbagai game dan anime,
                lengkap dengan cerita kenapa aku suka mereka.
            </p>

        </section>


        <section>

            <p class="writing-category">COLLECTION</p>

            <h2>The List</h2>

            <div id="waifu-grid" class="waifu-grid">
                <p class="coming-soon">Memuat...</p>
            </div>

        </section>


        <p>
            <a class="back-link" href="index.html">← Back to Fun Stuff</a>
        </p>

    </main>


    <footer>
        <p>© 2026 Ramdhan</p>
    </footer>


    <script type="module" src="waifu.js"></script>

  <script type="module" src="../auth-widget.js"></script>
</body>

</html>
